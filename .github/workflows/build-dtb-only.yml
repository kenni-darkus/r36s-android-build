name: Build R36S Clone Type2 DTB only

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dtb:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu device-tree-compiler git

      - name: Clone exact AndR36oid source
        run: |
          git clone --depth 1 --branch lineage-18.1 https://github.com/andr36oid/android_kernel_gameconsole_r36s.git kernel
          cd kernel
          test "$(git rev-parse HEAD)" = "66f1d314280c082cafb8fe9620f03873973c35af"

      - name: Add clone DTS
        run: |
          cp rk3326-r36s-android-clone-type2-panel1.dts kernel/arch/arm64/boot/dts/rockchip/
          sed -i '/rk3326-r36s-android-panel6.dtb/a dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3326-r36s-android-clone-type2-panel1.dtb' kernel/arch/arm64/boot/dts/rockchip/Makefile

      - name: Configure and build DTB
        run: |
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- lineageos_r36s_defconfig
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 rockchip/rk3326-r36s-android-clone-type2-panel1.dtb
          test -s kernel/arch/arm64/boot/dts/rockchip/rk3326-r36s-android-clone-type2-panel1.dtb

      - name: Package
        run: |
          mkdir out
          cp kernel/arch/arm64/boot/dts/rockchip/rk3326-r36s-android-clone-type2-panel1.dtb out/rk3326-r36s-android.dtb
          (cd out && sha256sum rk3326-r36s-android.dtb > SHA256SUMS.txt)
          printf '%s\n' 'R36S Clone Type2 Panel1 experimental Android DTB. Test Android card only. Keep original ArkOS card untouched.' > out/README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: r36s-clone-type2-panel1-dtb
          path: out/
          if-no-files-found: error
