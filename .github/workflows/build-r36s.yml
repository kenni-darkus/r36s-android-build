name: Build R36S Clone Type2 Android bring-up

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu device-tree-compiler git rsync

      - name: Clone AndR36oid kernel
        run: |
          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/andr36oid/android_kernel_gameconsole_r36s.git kernel
          cd kernel
          git submodule update --init --recursive || true
          test "$(git rev-parse HEAD)" = "66f1d314280c082cafb8fe9620f03873973c35af"

      - name: Install Clone Type2 Panel1 DTS
        run: |
          cp rk3326-r36s-android-clone-type2-panel1.dts \
            kernel/arch/arm64/boot/dts/rockchip/
          if ! grep -q 'rk3326-r36s-android-clone-type2-panel1.dtb' kernel/arch/arm64/boot/dts/rockchip/Makefile; then
            sed -i '/rk3326-r36s-android-panel6.dtb/a dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3326-r36s-android-clone-type2-panel1.dtb' \
              kernel/arch/arm64/boot/dts/rockchip/Makefile
          fi

      - name: Configure kernel
        run: |
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- lineageos_r36s_defconfig

      - name: Build custom DTB
        run: |
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 \
            rockchip/rk3326-r36s-android-clone-type2-panel1.dtb
          test -s kernel/arch/arm64/boot/dts/rockchip/rk3326-r36s-android-clone-type2-panel1.dtb

      - name: Build Android kernel Image
        continue-on-error: true
        run: |
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 Image

      - name: Prepare flash files
        if: always()
        run: |
          mkdir -p out
          if [ -s kernel/arch/arm64/boot/dts/rockchip/rk3326-r36s-android-clone-type2-panel1.dtb ]; then
            cp kernel/arch/arm64/boot/dts/rockchip/rk3326-r36s-android-clone-type2-panel1.dtb \
              out/rk3326-r36s-android.dtb
          fi
          if [ -s kernel/arch/arm64/boot/Image ]; then
            cp kernel/arch/arm64/boot/Image out/Image-clone-type2
          fi
          cat > out/README-TEST.txt <<'EOF'
          R36S Clone Type 2 / Panel1 experimental AndR36oid source build.

          Test card only. Do NOT alter the original ArkOS microSD.

          First test:
          1. Back up the existing rk3326-r36s-android.dtb from the Android BOOT partition.
          2. Replace it with the supplied rk3326-r36s-android.dtb.
          3. Leave the kernel Image unchanged for the first test.

          Image-clone-type2 is supplied only when a full kernel Image build also completed.
          Do not replace Image until specifically instructed after the DTB-only test.
          EOF
          (cd out && sha256sum rk3326-r36s-android.dtb Image-clone-type2 2>/dev/null || true) > out/SHA256SUMS.txt
          ls -lh out
          test -s out/rk3326-r36s-android.dtb

      - name: Upload flash package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36s-clone-type2-panel1-android
          path: out/
          if-no-files-found: error
